[package]
name = "udp-demo"
version = "0.4.2"
edition = "2021"
rust-version = "1.93"
resolver = "3"

[dependencies]
esp-idf-svc = "0.53"
log = "0.4"
anyhow = "1"
embedded-svc = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
embuild = "0.33"

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"
