# Builds the simulator for Linux, macOS and Windows. A tag like v1.0 also
# publishes the downloads as a GitHub release; a manual run (Actions tab,
# "Run workflow") only keeps them as build artifacts.
name: Simulator downloads

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
          - name: linux-arm64
            os: ubuntu-22.04-arm
          - name: macos
            os: macos-14
          - name: windows-x86_64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: display-server
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Test
        if: matrix.name == 'linux-x86_64'
        run: cargo test --release --locked

      - name: Build and package
        run: dist/package.sh ${{ matrix.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: PixelArena-${{ matrix.name }}
          path: |
            display-server/dist/out/*.tar.gz
            display-server/dist/out/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: downloads/*
